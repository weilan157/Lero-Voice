name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

# 创建 Release / 上传产物需要写权限（默认 GITHUB_TOKEN 只读，否则
# softprops/action-gh-release 报 403 "Resource not accessible by integration"）
permissions:
  contents: write

jobs:
  build:
    name: Build (esp32s31)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 编译环境说明（docs/SETUP.md "CI 编译环境"）----
      # espressif/esp-idf-ci-action 是官方 espressif/idf Docker 镜像的封装：
      #   - esp_idf_version 必须是 Docker Hub tag（v6.0 = espressif/idf:v6.0，
      #     内含全部目标工具链，含 esp32s31）
      #   - 镜像约 4.3GB：首次拉取较慢，GitHub 会自动缓存容器层，后续秒级
      #   - 通过挂载 .ccache 卷 + IDF_CCACHE_ENABLE 实现增量编译缓存，
      #     由 actions/cache 跨运行持久化（首次全量，之后增量）

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - uses: espressif/esp-idf-ci-action@v1
        with:
          # esp32s31 支持的最低版本线是 v6.1；DMA2D 芯片（esp32s31/esp32p4）
          # 需 v6.2+：esp_lvgl_adapter 0.5.x 在 IDF<6.2 时 include 独立的
          # esp_async_fbcpy.h 但未声明组件依赖（编译报头文件缺失，
          # esp32.com 论坛已确认官方 factory_demo 同问题），
          # IDF 6.2+ 改用内置 esp_driver_dma 的 esp_async_color_convert.h。
          # 截至 2026-08-27 IDF 6.2 未正式发布：Docker Hub 无
          # release-v6.2 / v6.2 / master tag，试 rc tag（v6.2-rc1）。
          esp_idf_version: v6.2-rc1
          target: esp32s31
          path: '.'
          # 组件依赖：IDF v6.1 起组件管理器不再随 cmake 自动执行
          # （v6.0 及以前的 component_manager.cmake 已移除），必须显式
          # 调用 idf.py update-dependencies 拉取 managed_components/；
          # 顺带确保/升级 idf-component-manager pip 包匹配接口版本。
          command: |
            python -m pip install -U --quiet idf-component-manager
            idf.py update-dependencies
            idf.py build
          # 注意：extra_docker_args 必须为单行（action 将其嵌入多行 docker
          # 命令；用 YAML 折叠标量 >- 合并换行为空格，禁止用 | 保留换行）
          extra_docker_args: >-
            -v ${{ github.workspace }}/.ccache:/root/.ccache
            -e CCACHE_DIR=/root/.ccache
            -e IDF_CCACHE_ENABLE=1

      - name: App size check (4 MB OTA slot limit)
        run: |
          SIZE=$(stat -c%s build/Lero-Voice.bin)
          test "$SIZE" -le 3984588 || { echo "app too large for OTA slot (limit 3.8 MB)"; exit 1; }
          echo "app size: $SIZE bytes (limit 3984588)"

      - name: Generate OTA metadata (meta.json)
        if: startsWith(github.ref, 'refs/tags/')
        # 注意：build/ 由 docker 容器以 root 生成，host 步骤不可写入；
        # 校验产物（app.sha256 / meta.json）写到仓库根（runner 可写）。
        run: |
          sha256sum build/Lero-Voice.bin | awk '{print $1}' > app.sha256
          PT_SHA=$(sha256sum partitions.csv | awk '{print $1}')
          SIZE=$(stat -c%s build/Lero-Voice.bin)
          jq -n --arg v "$GITHUB_REF_NAME" \
                 --arg s "$(cat app.sha256)" \
                 --arg p "$PT_SHA" \
                 --argjson n "$SIZE" \
            '{version:$v, min_app_version:"v1.0.0", target:"esp32s31-wroom-3",
              soc:"esp32s31", flash_size:16777216, psram:true,
              app_bin:"Lero-Voice.bin", app_bin_size:$n, app_sha256:$s,
              partition_table_sha256:$p, idf_version:"v6.2.0",
              build_date:(now|todateiso8601), release_notes:"", signature:""}' > meta.json

      - name: Create Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Lero-Voice.bin
            app.sha256
            meta.json

  static-analysis:
    name: Static analysis (cppcheck + MISRA, informational)
    runs-on: ubuntu-latest
    continue-on-error: true   # 参考性检查：MISRA 基线随实现推进逐步收紧
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: cppcheck MISRA addon on own code
        run: |
          cppcheck --addon=misra --enable=warning,style --std=c11 \
            --suppress=missingIncludeSystem --suppress=missingInclude \
            --inline-suppr \
            -Icomponents/bsp -Icomponents/ota_service -Icomponents/provisioning \
            -Icomponents/diag -Icomponents/player -Icomponents/voice -Imain \
            components main 2>&1 | tee cppcheck.log
          echo "--- summary ---"
          grep -c "error:" cppcheck.log || true
